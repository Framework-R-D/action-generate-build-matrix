# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --group lint ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --group lint ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked --group lint mypy .
        language: system
        files: ^(generate_matrix\.py|tests/)
        types_or: [python]
        pass_filenames: false
      - id: unit-tests
        name: Unit tests
        entry: uv run --locked --group test pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80
        language: system
        files: ^(generate_matrix\.py|tests/)
        types_or: [python]
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: uv run --locked --group lint yamllint
        language: system
        types: [yaml]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        entry: bash scripts/pre-commit/actionlint.sh
        verbose: true
  - repo: https://github.com/google/go-jsonnet
    rev: v0.22.0
    hooks:
      - id: jsonnet-format
      - id: jsonnet-lint
        # The files in test/max-parallelism import files that are generated during the build.
        # We therefore exclude them from linting, but still format them.
        exclude: ^test/max-parallelism
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        types_or: [yaml]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

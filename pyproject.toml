[project]
name = "action-generate-build-matrix"
version = "0.0.0"
requires-python = "==3.12.*"

[dependency-groups]
lint = [
  "mypy==2.4.0",
  "ruff==0.16.0",
  "yamllint==1.38.0",
]
test = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
]

[tool.uv]
package = false

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
plugins = [
]
show_error_codes = true
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "W",  # pycodestyle warnings
]
ignore = []
extend-ignore = [
    "E731", # do not assign a lambda expression, use a def
    "E203", # whitespace before ':'
]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["generate_matrix"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
omit = ["tests/*"]

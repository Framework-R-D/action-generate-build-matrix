name: Python Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
      checkout_path: ${{ steps.setup.outputs.checkout_path }}
      has_changes: ${{ steps.setup.outputs.has_changes }}
    steps:
      - name: Workflow setup (Python relevance)
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1
        with:
          file-type: python

  python-check:
    needs: setup
    if: >
      always() && needs.setup.result == 'success' && (
        github.event_name != 'pull_request' ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository: ${{ needs.setup.outputs.repo }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Run ruff check
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: uv run --locked --group lint ruff check
      - name: Run ruff format check
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: uv run --locked --group lint ruff format --check
      - name: Run mypy
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: uv run --locked --group lint mypy .

  python-test:
    needs: setup
    if: >
      always() && needs.setup.result == 'success' && (
        github.event_name != 'pull_request' ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.ref }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository: ${{ needs.setup.outputs.repo }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Run tests with coverage
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: |
          uv run --locked --group test pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=80

name: Python Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.setup.outputs.ref }}
      repo: ${{ steps.setup.outputs.repo }}
      checkout_path: ${{ steps.setup.outputs.checkout_path }}
      has_changes: ${{ steps.setup.outputs.has_changes }}
    steps:
      - name: Workflow setup (Python relevance)
        id: setup
        uses: Framework-R-D/action-workflow-setup@f73307dd8c13cb66c2565c9ace32571517b1cea8 # v1
        with:
          file-type: python

  python-check:
    needs: setup
    if: >
      always() && needs.setup.result == 'success' && (
        github.event_name != 'pull_request' ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository: ${{ needs.setup.outputs.repo }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv tool install ruff && uv tool install mypy
      - name: Run ruff check
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: ruff check
      - name: Run ruff format check
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: ruff format --check
      - name: Run mypy
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: mypy .

  python-test:
    needs: setup
    if: >
      always() && needs.setup.result == 'success' && (
        github.event_name != 'pull_request' ||
        needs.setup.outputs.has_changes == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.setup.outputs.ref }}
          path: ${{ needs.setup.outputs.checkout_path }}
          repository: ${{ needs.setup.outputs.repo }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Run tests with coverage
        working-directory: ${{ needs.setup.outputs.checkout_path }}
        run: |
          uv run --with pytest --with pytest-cov             pytest tests/ -v             --cov=.             --cov-report=term-missing             --cov-fail-under=80
